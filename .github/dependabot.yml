version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Minecraft runtime module versions must follow the supported engine contract.
      - dependency-name: '@minecraft/server'
      - dependency-name: '@minecraft/server-ui'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
