name: 发布版本
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的版本标签，例如 v2.0.14（恢复中断的发布）
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: npm ci
      - name: 核对版本标签
        run: python -c 'import json, os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("package.json", encoding="utf-8"))["version"]'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:verify
      - name: 上传、核对并正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-${{ env.RELEASE_TAG }}
          path: dist/release-${{ env.RELEASE_TAG }}.json
          if-no-files-found: error
          retention-days: 30
