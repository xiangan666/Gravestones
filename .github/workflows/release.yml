name: 创建版本草稿
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 核对版本标签
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!==`v${p.version}`)process.exit(1)'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: 创建草稿Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Gravestones-lanshiyi-${GITHUB_REF_NAME}.mcaddon" --draft --verify-tag --title "墓碑模组 $GITHUB_REF_NAME · lanshiyi" --notes-file "docs/RELEASE-${GITHUB_REF_NAME#v}.md"
